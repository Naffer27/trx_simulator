{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  {% if new_treasury_request_url %}
  <li>
    <a href="{{ new_treasury_request_url }}" class="historylink"
       style="background:rgba(232,200,74,.15);color:#e8c84a;border:1px solid rgba(232,200,74,.3);
              border-radius:4px;padding:5px 14px;font-size:.75rem;font-weight:700;
              text-decoration:none;letter-spacing:.04em;">
      New Treasury Request →
    </a>
  </li>
  {% endif %}
  {% if treasury_operational_dashboard_url %}
  <li>
    <a href="{{ treasury_operational_dashboard_url }}" class="historylink"
       style="background:rgba(230,126,34,.15);color:#e67e22;border:1px solid rgba(230,126,34,.3);
              border-radius:4px;padding:5px 14px;font-size:.75rem;font-weight:700;
              text-decoration:none;letter-spacing:.04em;">
      Operational Dashboard →
    </a>
  </li>
  {% endif %}
  {{ block.super }}
{% endblock %}

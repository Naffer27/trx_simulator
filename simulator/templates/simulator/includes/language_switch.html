{% load ui_language %}
{% ui_language as selected_language %}
<form class="mb-language-switch" action="{% url 'set_language' %}" method="post" aria-label="{% ui 'Idioma' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="es" lang="es" aria-label="Español" aria-pressed="{% if selected_language == 'es' %}true{% else %}false{% endif %}">ES</button>
  <button type="submit" name="language" value="en" lang="en" aria-label="English" aria-pressed="{% if selected_language == 'en' %}true{% else %}false{% endif %}">EN</button>
</form>
<style>
  .mb-language-switch { display:inline-flex; align-items:center; flex-shrink:0; gap:2px; margin:0; padding:2px; border:1px solid rgba(128,128,140,.25); border-radius:7px; background:transparent; vertical-align:middle; }
  .mb-language-switch button { appearance:none; box-sizing:border-box; width:28px; min-width:28px; height:28px; min-height:28px; padding:0; margin:0; border:0; border-radius:4px; background:transparent; color:#92929e; font:600 11px/1 system-ui,sans-serif; letter-spacing:.02em; cursor:pointer; }
  .mb-language-switch button:hover { background:rgba(128,128,140,.12); }
  .mb-language-switch button[aria-pressed="true"] { background:rgba(255,215,0,.12); color:#ffd700; }
  .mb-language-switch button:focus-visible { outline:2px solid #b88a00; outline-offset:2px; }
  [data-theme="light"] .mb-language-switch button[aria-pressed="true"] { background:rgba(184,138,0,.12); color:#795900; }
  @media (pointer:coarse) { .mb-language-switch button { width:32px; min-width:32px; height:32px; min-height:32px; } }
  .mb-auth-language { position:absolute; top:12px; right:12px; z-index:10; }
  @media (max-width:480px) { .app-topbar .tb-right { gap:6px; } .app-topbar .tb-breadcrumb { min-width:0; } }
</style>
